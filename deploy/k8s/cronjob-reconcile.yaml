# INDEPENDENT recovery job (ADR-0016) as a Kubernetes CronJob.
#
# DESIGN CHOICE — a SEPARATE process running the conductor binary in `-reconcile`
# mode against the SHARED Postgres store, NOT a goroutine inside the daemon loop.
#
# ADR-0016 requires the reaper to be INDEPENDENT of the daemon loop: a conductor
# cannot rescue its OWN death, so the stale-lease reaper + git-trailer task
# reconcile must run as a different process, scheduled by k8s itself, surviving any
# single daemon's death. 2B-3 built the host-heartbeat OwnerLive + the Reconciler,
# but nothing in the product ran `reconcile.ReapLeases`, so a dead host's lease
# never actually freed up. This CronJob closes that gap: every minute it runs ONE
# reconcile pass that
#   - reaps every lease whose owning host stopped heartbeating (CONDUCTOR_HOST_STALE)
#     or whose age exceeds the TTL backstop (CONDUCTOR_LEASE_TTL), freeing the repo
#     for a capable host (ADR-0024, 2B-3); and
#   - derives merged tasks done from EXACT [task:<id>] git trailers (ReconcileTasks,
#     ADR-0004/0010) — a clean no-op here because the ephemeral reconcile pod has no
#     per-project clones; the lease reaper reads only the shared store, so it works
#     fully without a workspace. (A deployment that wants trailer reconcile in this
#     job can mount the clones and set CONDUCTOR_ROOT.)
#
# It REQUIRES the shared Postgres DSN (reaping across hosts needs the central store,
# never a process-local memory store) — supplied from the same conductor-secret the
# daemon uses. The DSN is NEVER logged (it carries the Postgres password). The job
# exits 0 on a clean pass and non-zero on a reconcile error, so a failed Job surfaces
# to alerting (Prometheus kube_job_status_failed / Alertmanager).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: conductor-reconcile
  namespace: conductor-platform
  labels:
    app.kubernetes.io/name: conductor-reconcile
    app.kubernetes.io/component: recovery-job
spec:
  schedule: "* * * * *" # every minute
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        metadata:
          labels:
            app.kubernetes.io/name: conductor-reconcile
            app.kubernetes.io/component: recovery-job
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              # Same conductor image as the daemon; here invoked in -reconcile mode.
              image: conductor-platform:latest
              imagePullPolicy: IfNotPresent
              # ONE reconcile pass, then exit. The DSN comes from the secret env
              # (CONDUCTOR_DSN); the thresholds default in the binary but are pinned
              # here for clarity. -reconcile short-circuits before any daemon wiring.
              args:
                - "-reconcile"
                - "-lease-ttl"
                - "$(CONDUCTOR_LEASE_TTL)"
                - "-host-stale"
                - "$(CONDUCTOR_HOST_STALE)"
              env:
                # Independent recovery job tunables (ADR-0016). Generous TTL so a
                # healthy long-running develop is never reaped; host-stale of a few
                # heartbeat intervals so a single missed beat does not free a live repo.
                - name: CONDUCTOR_LEASE_TTL
                  value: "30m"
                - name: CONDUCTOR_HOST_STALE
                  value: "2m"
              # Pull ONLY the secret (the shared DSN). The reconcile job needs no
              # configmap (no project/interval/heartbeat): it reaps across ALL projects.
              envFrom:
                - secretRef:
                    name: conductor-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                runAsGroup: 65532
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "25m"
                  memory: "32Mi"
                limits:
                  cpu: "250m"
                  memory: "128Mi"
