# ============================================================================
# DEV / BOOTSTRAP Postgres for the conductor store (postgres:16-alpine).
#
# This is a minimal in-cluster Postgres so the stack runs end-to-end out of the
# box. For PRODUCTION use MANAGED Postgres (RDS/Cloud SQL/Crunchy) and point
# CONDUCTOR_DSN (secret.yaml) at it with sslmode=require — then you can delete
# this file from the kustomization.
#
# The password below is a DEV-ONLY PLACEHOLDER (CHANGEME) and is intentionally the
# same placeholder referenced by the DSN in secret.yaml. NOT a real secret.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: conductor-postgres-secret
  namespace: conductor-platform
type: Opaque
stringData:
  # DEV-ONLY PLACEHOLDER — must match the password embedded in secret.yaml's DSN.
  POSTGRES_USER: "conductor"
  POSTGRES_PASSWORD: "CHANGEME"
  POSTGRES_DB: "conductor"
---
# Headless Service so the StatefulSet pod gets a stable DNS name
# (conductor-postgres). The conductor DSN targets this Service name.
apiVersion: v1
kind: Service
metadata:
  name: conductor-postgres
  namespace: conductor-platform
  labels:
    app.kubernetes.io/name: conductor-postgres
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: conductor-postgres
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: conductor-postgres
  namespace: conductor-platform
  labels:
    app.kubernetes.io/name: conductor-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: conductor-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: conductor-postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conductor-postgres
        app.kubernetes.io/component: database
    spec:
      securityContext:
        # postgres:16-alpine runs as uid 70 (the `postgres` user). fsGroup makes
        # the PVC group-writable by it.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: conductor-postgres-secret
          env:
            # Keep PGDATA in a subdir so the mounted volume root (lost+found etc.)
            # does not collide with initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "conductor", "-d", "conductor"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "conductor", "-d", "conductor"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
