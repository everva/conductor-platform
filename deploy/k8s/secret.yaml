# ============================================================================
# TEMPLATE SECRET — DO NOT COMMIT REAL VALUES.
#
# The values below are OBVIOUS PLACEHOLDERS. Before applying to a real cluster
# replace them, and in production do NOT manage this Secret as plain YAML at all.
# Use a real secret manager:
#   - Sealed Secrets (bitnami)   - encrypts the Secret so it CAN be committed
#   - SOPS + age/KMS             - encrypts values in git
#   - External Secrets Operator  - syncs from Vault/AWS SM/GCP SM/Infisical
#
# The daemon NEVER logs the DSN (it carries the Postgres password); /status only
# ever exposes the backend NAME (memory/postgres), never the connection string.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: conductor-secret
  namespace: conductor-platform
type: Opaque
stringData:
  # Postgres connection string. Points at the in-cluster Postgres Service
  # (`conductor-postgres`, see postgres.yaml) by default. The password here is an
  # OBVIOUS PLACEHOLDER — replace it (and the matching one in postgres.yaml) and
  # prefer sslmode=require with managed Postgres in production.
  CONDUCTOR_DSN: "postgres://conductor:CHANGEME@conductor-postgres:5432/conductor?sslmode=disable"
  # The performer command (CONDUCTOR_DEVELOP_CMD) is a SUBSCRIPTION session, not an
  # API key. It defaults in the image to `claude -p` and carries no secret, so it
  # is intentionally NOT set here. Override it only if your performer differs.
  #
  # gh-token for the provisioner's git credential helper (writable clones/pushes,
  # ADR-0017). REPLACE_ME — supply a real token via your secret manager. The
  # daemon does not read GH_TOKEN directly; wire it into git's credential helper
  # in your deployment overlay. Left here as the documented placeholder slot.
  GH_TOKEN: "REPLACE_ME"
