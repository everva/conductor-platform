# ClusterIP Service for the conductor-api gateway (Faz-3, 3A-4). Exposes :8080 as
# `http` so the Ingress (and any in-cluster client — the web cockpit in Dalga 3B)
# can reach the REST + WebSocket surface and the k8s probes.
apiVersion: v1
kind: Service
metadata:
  name: conductor-api
  namespace: conductor-platform
  labels:
    app.kubernetes.io/name: conductor-api
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: conductor-api
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
