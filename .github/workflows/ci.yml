name: CI

# Runs the same deterministic gate the project uses locally:
# go build / go test (-race) / go vet / golangci-lint, plus the hermetic
# e2e-tagged test. No secrets required — the product uses subscription
# `claude -p`; CI only builds, tests, vets and lints.
on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: build / test / vet / lint
    # Organization-level self-hosted Linux runner (org-runner-1, labels
    # self-hosted/Linux/X64) instead of GitHub-hosted ubuntu-latest.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: E2E test (hermetic, -tags e2e)
        # The e2e suite drives a throwaway LOCAL git repo with a deterministic
        # shell performer in place of `claude -p`; it needs only git + go and no
        # network, so it runs hermetically in CI.
        run: go test -tags e2e -run E2E ./internal/conductor/

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.0

  # Frontend (web cockpit) deterministic gate — the TS analogue of the Go gate
  # (ADR-0026): typecheck + lint + unit tests + build + Playwright e2e. The web/
  # tree is an ISOLATED toolchain (its own web/go.mod carves it out of the Go
  # module), so this runs as a separate job. The cockpit consumes the gateway's
  # HTTP/WS surface; these tests mock it (vitest + Playwright page.route), so no
  # gateway/Postgres/claude is needed — the job is hermetic.
  frontend:
    name: web cockpit (tsc / eslint / vitest / build / e2e)
    # Same org-level self-hosted Linux runner as the Go gate.
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go (for the event-type codegen sync check)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Verify event types are in sync with the Go source (N-9 codegen)
        # The cockpit's event types are generated from internal/events (cmd/eventgen).
        # Regenerate and fail if the committed file drifted from the Go source.
        run: |
          cd ..
          go run ./cmd/eventgen -out web/src/types/events.gen.ts
          git diff --exit-code -- web/src/types/events.gen.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build

      # Playwright browser-e2e is BEST-EFFORT on the self-hosted runner (it is NOT
      # the deterministic gate — tsc/eslint/vitest/build above are, and they block).
      # The chromium browser binary installs into the runner user's cache (no root).
      # Launching it needs system libraries (libnss3, libgbm, …). We do NOT run
      # `apt`/sudo from CI (no sudo password in CI; it also breaks log masking and is
      # fragile across runner distros). Instead, install those libs ONCE on the
      # runner as a one-time admin task:  sudo npx playwright install-deps chromium
      # Until then these two steps may fail to launch the browser; continue-on-error
      # keeps that from reding the gate. Flip continue-on-error to false once the
      # runner has the libs to make the e2e blocking.
      - name: Install Playwright browser (chromium)
        continue-on-error: true
        run: npx playwright install chromium

      - name: E2E (Playwright, best-effort)
        continue-on-error: true
        run: npm run e2e
