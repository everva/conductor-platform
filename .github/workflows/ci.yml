name: CI

# Runs the same deterministic gate the project uses locally:
# go build / go test (-race) / go vet / golangci-lint, plus the hermetic
# e2e-tagged test. No secrets required — the product uses subscription
# `claude -p`; CI only builds, tests, vets and lints.
on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: build / test / vet / lint
    # Organization-level self-hosted Linux runner (org-runner-1, labels
    # self-hosted/Linux/X64) instead of GitHub-hosted ubuntu-latest.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # cache:false on the self-hosted runner — its GOMODCACHE is persistent
          # (already warm), and Go marks module files read-only, so the action's
          # cache RESTORE tar fails with "Cannot open: File exists" trying to extract
          # over them. Disabling the action cache avoids that conflict; the warm
          # on-disk cache makes builds fast anyway.
          cache: false

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: E2E test (hermetic, -tags e2e)
        # The e2e suite drives a throwaway LOCAL git repo with a deterministic
        # shell performer in place of `claude -p`; it needs only git + go and no
        # network, so it runs hermetically in CI.
        run: go test -tags e2e -run E2E ./internal/conductor/

      - name: golangci-lint
        # golangci-lint v2.x (the project's .golangci.yml is v2) requires
        # golangci-lint-action v7 — v6 only supports golangci-lint v1 and errors
        # with "v2 is not supported" on a v2 version string.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.0

  # Frontend (web cockpit) deterministic gate — the TS analogue of the Go gate
  # (ADR-0026): typecheck + lint + unit tests + build + Playwright e2e. The web/
  # tree is an ISOLATED toolchain (its own web/go.mod carves it out of the Go
  # module), so this runs as a separate job. The cockpit consumes the gateway's
  # HTTP/WS surface; these tests mock it (vitest + Playwright page.route), so no
  # gateway/Postgres/claude is needed — the job is hermetic.
  frontend:
    name: web cockpit (tsc / eslint / vitest / build / e2e)
    # Same org-level self-hosted Linux runner as the Go gate.
    runs-on: [self-hosted, Linux, X64]
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Go (for the event-type codegen sync check)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # cache:false — persistent GOMODCACHE on the self-hosted runner makes the
          # action's cache restore tar conflict with read-only module files
          # ("Cannot open: File exists"). The warm on-disk cache suffices.
          cache: false

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Verify event types are in sync with the Go source (N-9 codegen)
        # The cockpit's event types are generated from internal/events (cmd/eventgen).
        # Regenerate and fail if the committed file drifted from the Go source.
        run: |
          cd ..
          go run ./cmd/eventgen -out web/src/types/events.gen.ts
          git diff --exit-code -- web/src/types/events.gen.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build

      # Playwright browser-e2e is a BLOCKING gate (sweep S-2): org-runner-1 has the
      # browser system libraries and the e2e passes there, so it is enforced. The
      # chromium binary installs into the runner user's cache (no root needed). We do
      # NOT run apt/sudo from CI; if a runner ever lacks the system libs, install them
      # ONCE as an admin task — `sudo npx playwright install-deps chromium` — rather
      # than weakening this gate.
      - name: Install Playwright browser (chromium)
        run: npx playwright install chromium

      - name: E2E (Playwright)
        run: npm run e2e
